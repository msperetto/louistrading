<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Backtest Results Dashboard</title>
  <!-- <script src="https://cdn.plot.ly/plotly-latest.min.js"></script> -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-3.1.0-rc.1.min.js" charset="utf-8"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <style>
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    .plotly-graph-div { background: white; border-radius: 0.5rem; padding: 1rem; }
    .top10-list { background: white; border-radius: 0.5rem; padding: 1rem; }
  </style>
</head>
<body class="bg-gray-100 p-4">
  <div class="container mx-auto">
    <h1 class="text-3xl font-bold mb-4 text-center">Backtest Results Dashboard</h1>

    <!-- Filter Section -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
      <select id="filter_pair" class="p-2 rounded border border-gray-300">
        <option value="">All Coins</option>
      </select>
      <input type="date" id="filter_start" class="p-2 rounded border border-gray-300" placeholder="Start Date"/>
      <input type="date" id="filter_end" class="p-2 rounded border border-gray-300" placeholder="End Date"/>
      <select id="filter_metric" class="p-2 rounded border border-gray-300">
        <option value="return_percent">Return %</option>
        <option value="sharpe_ratio">Sharpe Ratio</option>
        <option value="win_rate">Win Rate</option>
        <option value="profit_factor">Profit Factor</option>
        <option value="max_drawdown">Max Drawdown</option>
      </select>
      <button id="reset-selection-btn" class="p-2 bg-blue-500 text-white rounded">
        Reset Selection
      </button>
    </div>


    <div class="dashboard-grid mb-8">
      <div class="plotly-graph-div">
        <h2 class="text-xl font-semibold mb-2">Top by Score</h2>
        <table id="top_score_table"></table>
      </div>
      <div class="plotly-graph-div">
        <h2 class="text-xl font-semibold mb-2">Risk vs Return Density (Hexbin)</h2>
        <div id="risk_return_density_chart"></div>
      </div>
   </div>

    <div class="dashboard-grid mb-8">
      <div class="plotly-graph-div">
        <h2 class="text-xl font-semibold mb-2">Max Drawdawn per Sharpe Ratio</h2>
        <table id="bubble_chart"></table>
      </div>
      <div class="plotly-graph-div">
        <h2 class="text-xl font-semibold mb-2">Win Rate per Profit Factor</h2>
        <div id="winrate_profitfactor_scatter"></div>
      </div>
   </div>

    <div class="dashboard-grid mb-8">
      <div class="plotly-graph-div">
        <h2 class="text-xl font-semibold mb-2">Sharpe Ratio Histogram</h2>
        <table id="sharpe_ratio_histogram"></table>
      </div>
      <div class="plotly-graph-div">
        <h2 class="text-xl font-semibold mb-2">Risk vs Return Density (Hexbin)</h2>
        <div id="winrate_profitfactor_scatter"></div>
      </div>
   </div>

    <div class="bg-white rounded p-4">
      <h2 class="text-xl font-semibold mb-2">All Results</h2>
      <table id="results_table" class="display w-full text-sm"></table>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
