# Commands to run services below:
# docker-compose run --rm --service-ports app
# docker compose up -d db
# docker-compose run --rm backtest
# Enter database via terminal:
# docker exec -it noshirt-postgres psql -U postgres -d noshirt

services: 
  app:
    build: .
    container_name: noshirt_app
    volumes:
      - .:/noshirt
    environment:
      - PYTHONPATH=/noshirt/main
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    command: python main/prod/app.py
    ports:
      - "8080:80"
    secrets:
      - decrypt_secret_trading
    depends_on:
      - db

  api:
    build: .
    container_name: noshirt_api
    restart: always
    volumes:
      - .:/noshirt
    environment:
      - ENVIRONMENT=AWS
      - PYTHONPATH=/noshirt/main
      - TELEGRAM_API_KEY=${TELEGRAM_API_KEY}
      - GROUP_ID_OPERATIONS=${GROUP_ID_OPERATIONS}
      - GROUP_ID_ALERTS=${GROUP_ID_ALERTS}
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    secrets:
      - decrypt_secret_trading
    command: uvicorn main.prod.api:api --host=0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      - db

  delist:
    build: .
    container_name: noshirt_delist
    volumes:
      - .:/noshirt
    restart: always
    environment:
      - PYTHONPATH=/noshirt/main
      - TELEGRAM_API_KEY=${TELEGRAM_API_KEY}
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    command: python main/prod/app_delist.py
    secrets:
      - decrypt_secret_delist
    depends_on:
      - db

  update_account_balances:
    build: .
    container_name: noshirt_update_account_balances
    volumes:
      - .:/noshirt
    restart: always
    environment:
      - PYTHONPATH=/noshirt/main
      - TELEGRAM_API_KEY=${TELEGRAM_API_KEY}
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    command: python main/prod/app_update_account_balances.py
    secrets:
      - decrypt_secret_trading
      - decrypt_secret_delist
    depends_on:
      - db

  binance_unit_test:
    build: .
    container_name: noshirt_binance_unit_test
    volumes:
      - .:/noshirt
    environment:
      - PYTHONPATH=/noshirt/main
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    command: python main/tests/binance_endpoints.py
    depends_on:
      - db

  telegram:
    build: .
    container_name: noshirt_telegram
    volumes:
      - .:/noshirt
    environment:
      - ENVIRONMENT=AWS
      - TELEGRAM_API_KEY=${TELEGRAM_API_KEY}
      - EC2_PUBLIC_IP=${EC2_PUBLIC_IP}
      - PYTHONPATH=/noshirt/main
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    command: python main/prod/telegram_bot.py
    depends_on:
      - db
  
  stop:
    build: .
    container_name: noshirt_stop
    volumes:
      - .:/noshirt
    environment:
      - PYTHONPATH=/noshirt/main
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    command: python main/marlinStop/stopService.py
    depends_on:
      - db
    
  backtest:
    build: .
    container_name: noshirt_backtest
    volumes:
      - .:/noshirt
    environment:
      - PYTHONPATH=/noshirt/main
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    command: python main/backtest/app.py
    ports:
      - "8081:81"
    depends_on:
      - db

  # Integration test runner service
  integration_test:
    build: .
    container_name: noshirt_integration_test
    volumes:
      - .:/noshirt
    environment:
      - PYTHONPATH=/noshirt/main
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - API_BASE_URL=http://api:8000
      - ENVIRONMENT=TEST
    command: python main/tests/integration/delist_integration_test.py
    depends_on:
      - db
      - api
      - delist
    profiles:
      - test  # Only runs when explicitly called

  db:
    image: postgres
    container_name: noshirt-postgres
    environment:
      - POSTGRES_DB=noshirt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - noshirt_postgres_data:/var/lib/postgresql/data
      - ./main/prod/resources/db:/resources/prod
      - ./main/backtest/resources/db:/resources/backtest
    ports:
      - "5431:5432"
    # entrypoint: ["bin/bash", "/resources/init-db.sh"]

secrets:
  decrypt_secret_trading:
    file: ~/.secrets/marlin/decrypt_secret_trading.txt
  decrypt_secret_delist:
    file: ~/.secrets/marlin/decrypt_secret_delist.txt

volumes:
  noshirt_postgres_data:
